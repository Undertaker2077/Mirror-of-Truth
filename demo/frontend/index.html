<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beauty Trust Demo</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d7dce5;
      --ink: #111827;
      --red: #b42318;
      --red-bg: #fee4e2;
      --amber: #b54708;
      --amber-bg: #fef0c7;
      --green: #027a48;
      --green-bg: #d1fadf;
      --blue: #175cd3;
      --blue-bg: #d1e9ff;
      --shadow: 0 14px 40px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 390px;
    }

    aside {
      background: #161b26;
      color: white;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    .brand span {
      display: block;
      color: #a4bcfd;
      font-size: 12px;
      margin-top: 4px;
      font-weight: 400;
    }

    .mode-list {
      display: grid;
      gap: 8px;
    }

    .mode-button {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      text-align: left;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 72px;
    }

    .mode-button.active {
      background: #eff4ff;
      color: #172033;
      border-color: #84adff;
    }

    .mode-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .mode-caption {
      color: inherit;
      opacity: .72;
      font-size: 12px;
      line-height: 1.35;
    }

    main {
      padding: 24px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      color: var(--ink);
    }

    .status-chip {
      border: 1px solid var(--line);
      background: white;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 16px;
      color: var(--ink);
    }

    .panel-body {
      padding: 18px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .upload-grid.single {
      grid-template-columns: minmax(0, 1fr);
    }

    .dropzone.slot-hidden {
      display: none !important;
    }

    .dropzone {
      position: relative;
      min-height: 360px;
      border: 1px dashed #98a2b3;
      background: #fbfcfe;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 6px;
    }

    .preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #eef1f6;
    }

    .file-label {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 2;
      background: rgba(17, 24, 39, .78);
      color: white;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      max-width: calc(100% - 20px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    button.primary,
    button.secondary {
      border: 1px solid transparent;
      border-radius: 8px;
      min-height: 40px;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: #1d2939;
      color: white;
    }

    button.primary:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    button.secondary {
      background: white;
      color: #344054;
      border-color: var(--line);
    }

    .result {
      background: #ffffff;
      border-left: 1px solid var(--line);
      padding: 24px 20px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .score-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: white;
      box-shadow: var(--shadow);
    }

    .score-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
      color: var(--red);
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      background: var(--red-bg);
      color: var(--red);
    }

    .meter {
      height: 10px;
      background: #eef1f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #12b76a, #f79009, #d92d20);
      transition: width .35s ease;
    }

    .result-section {
      margin-top: 18px;
    }

    .result-section h3 {
      font-size: 14px;
      margin: 0 0 10px;
      color: var(--ink);
    }

    .evidence-list {
      display: grid;
      gap: 8px;
    }

    .evidence {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      background: var(--blue-bg);
      color: var(--blue);
      font-weight: 700;
    }

    .json-box {
      white-space: pre-wrap;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      background: #101828;
      color: #e4e7ec;
      border-radius: 8px;
      padding: 12px;
      max-height: 260px;
      overflow: auto;
    }

    .placeholder {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfcfe;
    }

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
      }

      .mode-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .result {
        max-height: none;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 760px) {
      main {
        padding: 16px;
      }

      .mode-list,
      .upload-grid {
        grid-template-columns: 1fr;
      }

      .dropzone {
        min-height: 260px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        Beauty Trust Check
        <span>AI 图像鉴伪与妆效归因</span>
      </div>
      <div class="mode-list" role="tablist" aria-label="识别模式">
        <button class="mode-button active" data-mode="makeup-single" type="button">
          <div class="mode-title">妆造单图</div>
          <div class="mode-caption">AI 生成、美颜、磨皮、P 图痕迹</div>
        </button>
        <button class="mode-button" data-mode="fashion-single" type="button">
          <div class="mode-title">服装卖家秀</div>
          <div class="mode-caption">AI 生成、模特异常、布料与背景一致性</div>
        </button>
        <button class="mode-button" data-mode="before-after" type="button">
          <div class="mode-title">妆前妆后</div>
          <div class="mode-caption">美颜差异、局部美颜、光线与角度干扰</div>
        </button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h1 id="pageTitle">妆造单图检测</h1>
        </div>
        <div class="status-chip" id="modeStatus">single image / makeup</div>
      </div>

      <div class="workspace">
        <section class="panel">
          <div class="panel-header">
            <h2 id="inputTitle">输入图片</h2>
            <span class="status-chip" id="inputCount">0 / 1</span>
          </div>
          <div class="panel-body">
            <div class="upload-grid single" id="uploadGrid">
              <label class="dropzone" id="dropA">
                <span class="file-label" id="labelA">Image</span>
                <img alt="上传图片预览" class="preview" id="previewA" />
                <div class="empty" id="emptyA">
                  <strong>选择图片</strong>
                  JPG / PNG / WebP
                </div>
                <input id="fileA" type="file" accept="image/*" />
              </label>

              <label class="dropzone" id="dropB" hidden>
                <span class="file-label" id="labelB">After</span>
                <img alt="上传图片预览" class="preview" id="previewB" />
                <div class="empty" id="emptyB">
                  <strong>选择 After</strong>
                  JPG / PNG / WebP
                </div>
                <input id="fileB" type="file" accept="image/*" />
              </label>
            </div>

            <div class="actions">
              <button class="secondary" type="button" id="resetBtn">清空</button>
              <button class="secondary" type="button" id="exitBtn">退出检测</button>
              <button class="primary" type="button" id="analyzeBtn" disabled>开始检测</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <aside class="result">
      <div class="score-box">
        <div class="score-row">
          <div>
            <div class="verdict" id="verdict">待检测</div>
          </div>
          <div class="score" id="score">--</div>
        </div>
        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
      </div>

      <div class="result-section">
        <h3>关键证据</h3>
        <div class="placeholder" id="emptyResult">上传图片后生成检测结果。</div>
        <div class="evidence-list" id="evidenceList" hidden></div>
      </div>

      <div class="result-section">
        <h3>风险标签</h3>
        <div class="tag-row" id="tagRow"></div>
      </div>

      <div class="result-section">
        <h3>输出 JSON</h3>
        <div class="json-box" id="jsonBox">{}</div>
      </div>
    </aside>
  </div>

  <script>
    const MODES = {
      "makeup-single": {
        title: "妆造单图检测",
        status: "single image / makeup",
        inputTitle: "输入妆造图片",
        slots: 1,
        labels: ["Image"],
        risks: ["AI生成", "过度美颜", "磨皮遮瑕", "局部P图"],
      },
      "fashion-single": {
        title: "服装卖家秀检测",
        status: "single image / fashion",
        inputTitle: "输入卖家秀图片",
        slots: 1,
        labels: ["Image"],
        risks: ["AI生成", "人体比例异常", "布料纹理异常", "背景一致性"],
      },
      "before-after": {
        title: "妆前妆后对比检测",
        status: "before image + after image",
        inputTitle: "输入 Before / After",
        slots: 2,
        labels: ["Before", "After"],
        risks: ["美颜程度差异", "局部美颜", "曝光差异", "角度裁剪差异"],
      },
    };

    const state = {
      mode: "makeup-single",
      byMode: Object.fromEntries(
        Object.keys(MODES).map(mode => [mode, {
          files: { A: null, B: null },
          previews: { A: null, B: null },
          result: null,
        }])
      ),
    };

    const els = {
      pageTitle: document.getElementById("pageTitle"),
      modeStatus: document.getElementById("modeStatus"),
      inputTitle: document.getElementById("inputTitle"),
      inputCount: document.getElementById("inputCount"),
      uploadGrid: document.getElementById("uploadGrid"),
      dropB: document.getElementById("dropB"),
      labelA: document.getElementById("labelA"),
      labelB: document.getElementById("labelB"),
      previewA: document.getElementById("previewA"),
      previewB: document.getElementById("previewB"),
      emptyA: document.getElementById("emptyA"),
      emptyB: document.getElementById("emptyB"),
      fileA: document.getElementById("fileA"),
      fileB: document.getElementById("fileB"),
      analyzeBtn: document.getElementById("analyzeBtn"),
      resetBtn: document.getElementById("resetBtn"),
      exitBtn: document.getElementById("exitBtn"),
      verdict: document.getElementById("verdict"),
      score: document.getElementById("score"),
      meterFill: document.getElementById("meterFill"),
      emptyResult: document.getElementById("emptyResult"),
      evidenceList: document.getElementById("evidenceList"),
      tagRow: document.getElementById("tagRow"),
      jsonBox: document.getElementById("jsonBox"),
    };

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll(".mode-button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      renderMode();
    }

    function renderMode() {
      const config = MODES[state.mode];
      els.pageTitle.textContent = config.title;
      els.modeStatus.textContent = config.status;
      els.inputTitle.textContent = config.inputTitle;
      els.uploadGrid.classList.toggle("single", config.slots === 1);
      els.labelA.textContent = config.labels[0];
      els.labelB.textContent = config.labels[1] || "After";
      renderUploads();
      syncSlotVisibility();
      updateInputCount();
      if (currentStore().result) {
        renderResult(currentStore().result, false);
      } else {
        resetResult(false);
      }
    }

    function currentStore() {
      return state.byMode[state.mode];
    }

    function renderUploads() {
      renderPreview("A");
      renderPreview("B");
      els.fileA.value = "";
      els.fileB.value = "";
      syncSlotVisibility();
    }

    function syncSlotVisibility() {
      const isSingle = MODES[state.mode].slots === 1;
      els.dropB.hidden = isSingle;
      els.dropB.classList.toggle("slot-hidden", isSingle);
      els.dropB.style.display = isSingle ? "none" : "flex";
    }

    function renderPreview(slot) {
      const preview = slot === "A" ? els.previewA : els.previewB;
      const empty = slot === "A" ? els.emptyA : els.emptyB;
      const url = currentStore().previews[slot];
      if (url) {
        preview.src = url;
        preview.style.display = "block";
        empty.style.display = "none";
      } else {
        preview.removeAttribute("src");
        preview.style.display = "none";
        empty.style.display = "block";
      }
    }

    function clearPreview(slot) {
      const preview = slot === "A" ? els.previewA : els.previewB;
      const empty = slot === "A" ? els.emptyA : els.emptyB;
      const input = slot === "A" ? els.fileA : els.fileB;
      const store = currentStore();
      if (store.previews[slot]) URL.revokeObjectURL(store.previews[slot]);
      store.previews[slot] = null;
      store.files[slot] = null;
      preview.removeAttribute("src");
      preview.style.display = "none";
      empty.style.display = "block";
      input.value = "";
      syncSlotVisibility();
    }

    function handleFile(slot, file) {
      if (!file) return;
      const store = currentStore();
      if (store.previews[slot]) URL.revokeObjectURL(store.previews[slot]);
      store.files[slot] = file;
      store.previews[slot] = URL.createObjectURL(file);
      store.result = null;
      const preview = slot === "A" ? els.previewA : els.previewB;
      const empty = slot === "A" ? els.emptyA : els.emptyB;
      preview.src = store.previews[slot];
      preview.style.display = "block";
      empty.style.display = "none";
      syncSlotVisibility();
      updateInputCount();
      resetResult(false);
    }

    function updateInputCount() {
      const config = MODES[state.mode];
      const store = currentStore();
      const count = Number(Boolean(store.files.A)) + Number(config.slots === 2 && Boolean(store.files.B));
      els.inputCount.textContent = `${count} / ${config.slots}`;
      els.analyzeBtn.disabled = count !== config.slots;
    }

    function resetResult(clearStoredResult = true) {
      if (clearStoredResult) currentStore().result = null;
      els.verdict.textContent = "待检测";
      els.verdict.style.background = "#eef1f6";
      els.verdict.style.color = "#475467";
      els.score.textContent = "--";
      els.score.style.color = "var(--red)";
      els.meterFill.style.width = "0";
      els.emptyResult.hidden = false;
      els.evidenceList.hidden = true;
      els.evidenceList.innerHTML = "";
      els.tagRow.innerHTML = "";
      els.jsonBox.textContent = "{}";
    }

    function resetAll() {
      clearPreview("A");
      clearPreview("B");
      syncSlotVisibility();
      updateInputCount();
      resetResult();
    }

    function exitDetection() {
      resetAll();
      renderMode();
    }

    async function analyze() {
      const config = MODES[state.mode];
      els.analyzeBtn.disabled = true;
      els.analyzeBtn.textContent = "检测中";
      try {
        let response;
        if (config.slots === 1) {
          const form = new FormData();
          form.append("image", currentStore().files.A);
          form.append("mode", state.mode === "fashion-single" ? "fashion" : "makeup");
          form.append("backend", "sentry-convnext-small");
          response = await fetch("/api/analyze/single", { method: "POST", body: form });
        } else {
          const form = new FormData();
          form.append("before_image", currentStore().files.A);
          form.append("after_image", currentStore().files.B);
          form.append("backend", "sentry-convnext-small");
          response = await fetch("/api/analyze/before-after", { method: "POST", body: form });
        }
        if (!response.ok) throw new Error(`接口错误 ${response.status}`);
        renderResult(await response.json());
      } catch (error) {
        renderError(error);
      } finally {
        els.analyzeBtn.textContent = "开始检测";
        updateInputCount();
      }
    }

    function renderResult(payload, saveResult = true) {
      if (saveResult) currentStore().result = payload;
      const config = MODES[state.mode];
      const confidence = Math.round((payload.false_advertising_confidence || 0) * 100);
      const model = payload.model_output || payload.after_model_output || {};
      const visual = payload.visual_evidence || {};
      const verdict = payload.verdict === "High risk" ? "高风险" : payload.verdict === "Medium risk" ? "中风险" : "低风险";
      const aiLabel = model.label === "ai" ? "是" : model.label === "real" ? "否" : "未知";
      const evidences = [
        `AI生成检测：${aiLabel}，AI概率 ${formatPercent(model.probability_ai)}，backend=${model.backend || "N/A"}，mock=${Boolean(model.mock)}。`,
        `BeautyProof修图检测：修图概率 ${formatPercent(visual.retouch_probability)}，可靠性 ${visual.reliability || "N/A"}。`,
        ...(payload.evidence || []),
      ];
      if (payload.before_after_evidence) {
        evidences.push(`前后对比：可靠性 ${payload.before_after_evidence.comparison_reliability}，曝光差异 ${payload.before_after_evidence.exposure_diff}。`);
      }

      els.verdict.textContent = verdict;
      els.verdict.style.background = confidence >= 70 ? "var(--red-bg)" : confidence >= 42 ? "var(--amber-bg)" : "var(--green-bg)";
      els.verdict.style.color = confidence >= 70 ? "var(--red)" : confidence >= 42 ? "var(--amber)" : "var(--green)";
      els.score.textContent = `${confidence}%`;
      els.score.style.color = confidence >= 70 ? "var(--red)" : confidence >= 42 ? "var(--amber)" : "var(--green)";
      els.meterFill.style.width = `${confidence}%`;

      els.emptyResult.hidden = true;
      els.evidenceList.hidden = false;
      els.evidenceList.innerHTML = evidences.map(item => `<div class="evidence">${escapeHtml(item)}</div>`).join("");
      els.tagRow.innerHTML = config.risks.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      els.jsonBox.textContent = JSON.stringify(payload, null, 2);
    }

    function renderError(error) {
      els.verdict.textContent = "检测失败";
      els.verdict.style.background = "var(--red-bg)";
      els.verdict.style.color = "var(--red)";
      els.score.textContent = "--";
      els.meterFill.style.width = "0";
      els.emptyResult.hidden = true;
      els.evidenceList.hidden = false;
      els.evidenceList.innerHTML = `<div class="evidence">${escapeHtml(error.message)}</div>`;
      els.jsonBox.textContent = JSON.stringify({ error: error.message }, null, 2);
    }

    function formatPercent(value) {
      if (typeof value !== "number") return "N/A";
      return `${Math.round(value * 1000) / 10}%`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelectorAll(".mode-button").forEach(btn => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    els.fileA.addEventListener("change", event => handleFile("A", event.target.files[0]));
    els.fileB.addEventListener("change", event => handleFile("B", event.target.files[0]));
    els.resetBtn.addEventListener("click", resetAll);
    els.exitBtn.addEventListener("click", exitDetection);
    els.analyzeBtn.addEventListener("click", analyze);

    renderMode();
    resetResult();
  </script>
</body>
